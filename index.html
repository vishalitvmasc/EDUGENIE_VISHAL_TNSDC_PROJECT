<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>

<body>

<header class="hero">

    <div class="container">

        <div class="brand">
            EduGenie
        </div>

        <h1>
            Learn faster with your AI study assistant.
        </h1>

        <p>
            Ask questions, simplify concepts,
            generate quizzes, summarize passages,
            and build personalized learning paths.
        </p>

    </div>

</header>


<main class="container app-shell">

    <section class="card">

        <div class="controls">

            <label>

                Task

                <select id="task">

                    <option value="qa">
                        Q&amp;A
                    </option>

                    <option value="explain">
                        Explain
                    </option>

                    <option value="quiz">
                        Generate Quiz
                    </option>

                    <option value="summarize">
                        Summarize
                    </option>

                    <option value="learn">
                        Learning Path
                    </option>

                </select>

            </label>


            <label>

                Learner Level

                <select id="level">

                    <option value="beginner">
                        Beginner
                    </option>

                    <option value="intermediate">
                        Intermediate
                    </option>

                    <option value="advanced">
                        Advanced
                    </option>

                </select>

            </label>


            <label
                id="weeks-wrap"
                class="hidden"
            >

                Weeks

                <input
                    id="weeks"
                    type="number"
                    min="1"
                    max="52"
                    value="6"
                >

            </label>

        </div>


        <label for="input-text">

            Your Question or Study Material

        </label>


        <textarea
            id="input-text"
            rows="10"
            placeholder="Example: Explain the Pythagorean theorem with a simple example."
        ></textarea>


        <button id="submit-btn">

            Run EduGenie

        </button>


        <p
            id="error"
            class="error hidden"
        ></p>

    </section>


    <section
        id="result-card"
        class="card result-card hidden"
    >

        <div class="result-heading">

            <h2>
                Result
            </h2>

            <span
                id="source"
                class="source"
            ></span>

        </div>


        <div id="result"></div>

    </section>

</main>


<footer>

    EduGenie · FastAPI + Google Gemini +
    optional local LaMini model

</footer>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>

</html>
